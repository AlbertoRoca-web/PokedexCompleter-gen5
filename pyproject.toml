[project]
name = "pokedex-completer-gen5"
version = "0.1.0"
description = "AI-assisted Generation 5 Pokemon Living Dex completer."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Alberto Roca" }]
dependencies = [
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=1.0",
    "pillow>=10.4",
    "platformdirs>=4.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "rich>=13.7",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
]

[project.optional-dependencies]
ai = [
    "openai>=1.0",
    "anthropic>=0.40",
    "google-genai>=1.0",
]
vision = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
]
backend = [
    "supabase>=2.0",
]
rl = [
    "gymnasium>=0.29",
]
desktop = [
    "pyinstaller>=6.0",
]
dev = [
    "hypothesis>=6.0",
    "pyright>=1.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
rld = "pokedex_completer_gen5.cli.main:app"
rld-mcp = "pokedex_completer_gen5.server.mcp_stdio:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "playwright>=1.62.0",
]
