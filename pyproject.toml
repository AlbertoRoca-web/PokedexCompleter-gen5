[project]
name = "pokedex-completer-gen5"
version = "0.1.0"
description = "AI-assisted Generation 5 Pokemon Living Dex completer."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Alberto Roca" }]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
]

[project.optional-dependencies]
ai = [
    "openai>=1.0",
    "anthropic>=0.40",
]
vision = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "pillow>=10.4",
]
backend = [
    "supabase>=2.0",
    "sqlmodel>=0.0.22",
]
rl = [
    "gymnasium>=0.29",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
rld = "pokedex_completer_gen5.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
