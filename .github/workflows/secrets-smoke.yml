name: Secrets smoke check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-secrets:
    name: Check configured secret names
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Verify required future-integration secrets exist
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          check_secret() {
            local name="$1"
            local value="${!name:-}"
            if [[ -z "$value" ]]; then
              echo "missing: $name"
              missing=1
            else
              echo "configured: $name"
            fi
          }

          check_secret OPENAI_API_KEY
          check_secret ANTHROPIC_API_KEY
          check_secret GOOGLE_API_KEY
          check_secret HF_TOKEN
          check_secret PYPI_API_TOKEN
          check_secret SUPABASE_URL
          check_secret SUPABASE_PUBLISHABLE_KEY
          check_secret SUPABASE_SECRET_KEY

          if [[ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]]; then
            echo "configured: SUPABASE_SERVICE_ROLE_KEY"
          else
            echo "optional alias not configured: SUPABASE_SERVICE_ROLE_KEY"
          fi

          if [[ "$missing" -ne 0 ]]; then
            echo "One or more expected secrets are missing. Values were not printed. Good puppy."
            exit 1
          fi
